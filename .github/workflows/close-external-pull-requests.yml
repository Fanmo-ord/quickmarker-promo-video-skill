name: Close external pull requests

on:
  pull_request_target:
    types: [opened, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write

jobs:
  close-external-pull-request:
    if: github.event.pull_request.user.login != github.repository_owner
    runs-on: ubuntu-latest
    steps:
      - name: Explain policy and close pull request
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: >-
          gh pr close "$PR_URL"
          --comment "感谢关注。本仓库暂不接受外部 Pull Request；如需修改，请 Fork 后在自己的仓库中维护。"
